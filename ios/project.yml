# Xcode project definition. Generate the project with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen
#   xcodegen generate
#   open AlbumFamilial.xcodeproj
name: AlbumFamilial
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  AlbumKit:
    path: AlbumKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AlbumFamilial:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AlbumKit
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Album
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr]
        UILaunchScreen: {}
        NSCameraUsageDescription: Take photos to add them to the family album.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.album-familial # change to your own (e.g. com.yourname.album)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # your Apple Developer team id, or pick it in Xcode > Signing & Capabilities
